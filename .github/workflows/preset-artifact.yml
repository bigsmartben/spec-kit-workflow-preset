name: Preset Artifact

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to the tag version or next preset.yml patch version."
        required: false
        type: string
      spec_kit_ref:
        description: "bigsmartben/spec-kit git ref to install for smoke testing."
        required: false
        default: "main"
        type: string
      create_integration_pr:
        description: "Create or update a bigsmartben/spec-kit integration PR after a verified build."
        required: false
        default: false
        type: boolean

concurrency:
  group: preset-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-release-pr:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version || '' }}
      INPUT_SPEC_KIT_REF: ${{ inputs.spec_kit_ref || 'main' }}
      CREATE_INTEGRATION_PR: ${{ inputs.create_integration_pr || false }}
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTEST_ADDOPTS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Run preset contract tests
        run: python3 -m unittest tests/test_preset_contract.py

      - name: Derive and validate version
        id: version
        run: |
          set -euo pipefail

          PRESET_VERSION="$(python3 - <<'PY'
          import yaml

          with open("preset.yml", encoding="utf-8") as handle:
              preset = yaml.safe_load(handle)
          print(preset["preset"]["version"])
          PY
          )"
          TAG_VERSION=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi

          NEXT_PATCH_VERSION="$(python3 - <<'PY'
          import yaml

          with open("preset.yml", encoding="utf-8") as handle:
              preset = yaml.safe_load(handle)
          major, minor, patch = (int(part) for part in preset["preset"]["version"].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )"

          VERSION="${INPUT_VERSION:-${TAG_VERSION:-${NEXT_PATCH_VERSION}}}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format: ${VERSION}" >&2
            exit 1
          fi
          if [[ -n "${INPUT_VERSION}" && "${VERSION}" != "${PRESET_VERSION}" && "${VERSION}" != "${NEXT_PATCH_VERSION}" ]]; then
            echo "Manual version ${VERSION} must match preset.yml version ${PRESET_VERSION} or next patch ${NEXT_PATCH_VERSION}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${VERSION}" != "${PRESET_VERSION}" && "${VERSION}" != "${NEXT_PATCH_VERSION}" ]]; then
            echo "Tag version ${VERSION} must match preset.yml version ${PRESET_VERSION} or next patch ${NEXT_PATCH_VERSION}" >&2
            exit 1
          fi
          if [[ -n "${TAG_VERSION}" && "${VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Version ${VERSION} does not match tag v${TAG_VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=spec-kit-workflow-preset-v${VERSION}.zip" >> "${GITHUB_OUTPUT}"

      - name: Apply release version to preset workspace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          version = os.environ["VERSION"]
          preset_path = Path("preset.yml")
          preset = yaml.safe_load(preset_path.read_text(encoding="utf-8"))
          preset["preset"]["version"] = version
          preset_path.write_text(yaml.safe_dump(preset, sort_keys=False), encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = re.sub(
              r"releases/download/v[0-9]+\.[0-9]+\.[0-9]+/spec-kit-workflow-preset-v[0-9]+\.[0-9]+\.[0-9]+\.zip",
              f"releases/download/v{version}/spec-kit-workflow-preset-v{version}.zip",
              readme,
          )
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Build preset artifact
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_NAME="spec-kit-workflow-preset-v${VERSION}.zip"
          MANIFEST_NAME="spec-kit-workflow-preset-v${VERSION}.manifest.json"
          rm -f "${ZIP_NAME}"
          rm -f "${MANIFEST_NAME}"

          python3 - <<'PY'
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          version = os.environ["VERSION"]
          zip_name = f"spec-kit-workflow-preset-v{version}.zip"
          manifest_name = f"spec-kit-workflow-preset-v{version}.manifest.json"
          include_roots = [
              "preset.yml",
              "README.md",
              "CHANGELOG.md",
              "LICENSE",
              "AGENTS.md",
              "commands",
              "templates",
              "schemas",
              "validators",
              "docs",
          ]
          forbidden_prefixes = (".github/", ".git/", "docs/superpowers/")
          forbidden_suffixes = (".pyc", ".pyo")

          def is_forbidden(name: str) -> bool:
              return (
                  name.startswith(forbidden_prefixes)
                  or "/__pycache__/" in f"/{name}"
                  or name.endswith(forbidden_suffixes)
              )

          files = []

          for root in include_roots:
              path = Path(root)
              if path.is_file():
                  files.append(path)
                  continue
              for file_path in path.rglob("*"):
                  if file_path.is_file():
                      files.append(file_path)

          packaged_files = []
          with ZipFile(zip_name, "w", compression=ZIP_DEFLATED) as archive:
              for file_path in sorted(files, key=lambda item: item.as_posix()):
                  name = file_path.as_posix()
                  if is_forbidden(name):
                      continue
                  content = file_path.read_bytes()
                  info = ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, content)
                  packaged_files.append(
                      {"path": name, "sha256": hashlib.sha256(content).hexdigest()}
                  )

          zip_sha256 = hashlib.sha256(Path(zip_name).read_bytes()).hexdigest()
          source_commit = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          release_manifest = {
              "schema_version": "1.0",
              "preset_id": "workflow-preset",
              "version": version,
              "source_repository": "https://github.com/bigsmartben/spec-kit-workflow-preset",
              "source_commit": source_commit,
              "artifact": {
                  "name": zip_name,
                  "sha256": zip_sha256,
              },
              "files": packaged_files,
          }
          Path(manifest_name).write_text(
              json.dumps(release_manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "manifest_name=${MANIFEST_NAME}" >> "${GITHUB_OUTPUT}"
          echo "manifest_path=${GITHUB_WORKSPACE}/${MANIFEST_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify preset artifact
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import zipfile

          required_entries = {
              "preset.yml",
              "commands/speckit.plan.md",
              "commands/speckit.tasks.md",
              "templates/plan-template.md",
              "templates/requirements/behavior-gate.md",
              "templates/requirements/nfr-gate.md",
              "templates/requirements/visual-gate.md",
              "templates/behavior/behavior-testability.md",
              "validators/speckit_behavior_contract.py",
              "docs/extension-governance.md",
          }
          forbidden_entries = {
              "commands/speckit.implement.md",
              "schemas/speckit.implement.manifest.v1.schema.json",
              "schemas/speckit.implement.handoff.v2.schema.json",
              "schemas/speckit.implement.receipt.v1.schema.json",
              "validators/speckit_implement_contract.py",
          }
          forbidden_prefixes = (".github/", ".git/", "docs/superpowers/")
          forbidden_suffixes = (".pyc", ".pyo")

          def is_forbidden(name: str) -> bool:
              return (
                  name.startswith(forbidden_prefixes)
                  or "/__pycache__/" in f"/{name}"
                  or name.endswith(forbidden_suffixes)
              )

          with zipfile.ZipFile(os.environ["ZIP_NAME"]) as archive:
              names = set(archive.namelist())

          missing = sorted(required_entries - names)
          if missing:
              print(f"Missing required artifact entries: {missing}", file=sys.stderr)
              sys.exit(1)
          forbidden = sorted(name for name in names if is_forbidden(name))
          if forbidden:
              print(f"Forbidden artifact entries: {forbidden}", file=sys.stderr)
              sys.exit(1)
          stale_runtime = sorted(forbidden_entries & names)
          if stale_runtime:
              print(f"Removed implement runtime entries found: {stale_runtime}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify release manifest
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          zip_path = Path(os.environ["ZIP_NAME"])
          manifest = json.loads(Path(os.environ["MANIFEST_NAME"]).read_text(encoding="utf-8"))
          assert manifest["artifact"]["name"] == zip_path.name
          assert manifest["artifact"]["sha256"] == hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert manifest["source_commit"]
          with zipfile.ZipFile(zip_path) as archive:
              actual = {
                  name: hashlib.sha256(archive.read(name)).hexdigest()
                  for name in archive.namelist()
              }
          expected = {entry["path"]: entry["sha256"] for entry in manifest["files"]}
          assert actual == expected
          PY

      - name: Install specify from fork in smoke venv
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          export TEMP="${RUNNER_TEMP}"
          export TMP="${RUNNER_TEMP}"
          python3 -m venv "${GITHUB_WORKSPACE}/.venv-specify-smoke"
          echo "${GITHUB_WORKSPACE}/.venv-specify-smoke/bin" >> "${GITHUB_PATH}"
          PATH="${GITHUB_WORKSPACE}/.venv-specify-smoke/bin:${PATH}"
          python3 -m pip install --upgrade pip
          python3 -m pip install "git+https://github.com/bigsmartben/spec-kit.git@${INPUT_SPEC_KIT_REF}"

      - name: Smoke install preset from checkout on GitHub runner
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          export TEMP="${RUNNER_TEMP}"
          export TMP="${RUNNER_TEMP}"
          PATH="${GITHUB_WORKSPACE}/.venv-specify-smoke/bin:${PATH}"
          project_dir="$(mktemp -d "${RUNNER_TEMP}/workflow-preset-smoke.XXXXXX")"
          resolve_out="${RUNNER_TEMP}/plan-template-resolve.txt"
          constitution_resolve_out="${RUNNER_TEMP}/constitution-template-resolve.txt"
          cd "$project_dir"
          specify init --here --integration claude --script sh --ignore-agent-tools
          test -f .claude/skills/speckit-implement/SKILL.md
          core_implement_sha="$(sha256sum .claude/skills/speckit-implement/SKILL.md | awk '{print $1}')"
          specify preset remove workflow-preset
          specify preset add --dev "$GITHUB_WORKSPACE"
          specify preset info workflow-preset
          specify preset resolve plan-template | tee "$resolve_out"
          grep -q "workflow-preset" "$resolve_out"
          specify preset resolve constitution-template | tee "$constitution_resolve_out"
          grep -q "workflow-preset" "$constitution_resolve_out"
          test -f .specify/presets/workflow-preset/preset.yml
          test -f .specify/presets/workflow-preset/templates/plan-template.md
          test -f .specify/presets/workflow-preset/templates/constitution-template.md
          test -f .specify/presets/workflow-preset/templates/requirements/behavior-gate.md
          test -f .specify/presets/workflow-preset/templates/behavior/behavior-testability.md
          grep -q "Change Scope Granularity" .specify/presets/workflow-preset/templates/constitution-template.md
          grep -q "R: Repository / Workspace" .specify/presets/workflow-preset/templates/constitution-template.md
          grep -q "M: Module / Capability" .specify/presets/workflow-preset/templates/constitution-template.md
          grep -q "U: Unit / Design Object" .specify/presets/workflow-preset/templates/constitution-template.md
          grep -q "O: Operation / Detail" .specify/presets/workflow-preset/templates/constitution-template.md
          test ! -e .specify/presets/workflow-preset/commands/speckit.implement.md
          test -f .claude/skills/speckit-implement/SKILL.md
          test "${core_implement_sha}" = "$(sha256sum .claude/skills/speckit-implement/SKILL.md | awk '{print $1}')"

      - name: Upload preset artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.manifest_name }}
          path: ${{ steps.package.outputs.manifest_path }}
          if-no-files-found: error

      - name: Create or update release artifact
        if: ${{ github.ref_type == 'tag' || env.CREATE_INTEGRATION_PR == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG_NAME="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "${CREATE_INTEGRATION_PR}" == "true" ]]; then
            if ! git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
              echo "Manual integration PR creation requires refs/tags/v${VERSION} to exist." >&2
              exit 1
            fi
            HEAD_SHA="$(git rev-parse HEAD)"
            TAG_SHA="$(git rev-parse "refs/tags/v${VERSION}^{}")"
            if [[ "${HEAD_SHA}" != "${TAG_SHA}" ]]; then
              echo "Manual integration PR creation requires HEAD ${HEAD_SHA} to match refs/tags/v${VERSION} ${TAG_SHA}." >&2
              exit 1
            fi
          fi
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            gh release download "${TAG_NAME}" \
              --pattern "${ZIP_NAME}" \
              --pattern "${MANIFEST_NAME}" \
              --dir "${existing_dir}"
            cmp "${ZIP_PATH}" "${existing_dir}/${ZIP_NAME}"
            cmp "${MANIFEST_PATH}" "${existing_dir}/${MANIFEST_NAME}"
          else
            gh release create "${TAG_NAME}" --verify-tag --title "${TAG_NAME}" --notes ""
            gh release upload "${TAG_NAME}" "${ZIP_PATH}" "${MANIFEST_PATH}"
          fi

      - name: Create or update spec-kit integration PR
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && env.CREATE_INTEGRATION_PR == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.SPEC_KIT_FORK_PR_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "SPEC_KIT_FORK_PR_TOKEN is required when integration PR creation is requested." >&2
            exit 1
          fi

          gh auth setup-git
          WORKFLOW_PRESET_DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ZIP_NAME}"
          WORKFLOW_PRESET_MANIFEST_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${MANIFEST_NAME}"
          fork_dir="$(mktemp -d)"
          gh repo clone bigsmartben/spec-kit "${fork_dir}/spec-kit" -- --depth 1 --branch "${INPUT_SPEC_KIT_REF}"

          release_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            "${WORKFLOW_PRESET_DOWNLOAD_URL}" \
            --output "${release_dir}/${ZIP_NAME}"
          curl --fail --location --silent --show-error \
            "${WORKFLOW_PRESET_MANIFEST_URL}" \
            --output "${release_dir}/${MANIFEST_NAME}"
          python3 - "${release_dir}/${ZIP_NAME}" "${release_dir}/${MANIFEST_NAME}" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert manifest["artifact"]["name"] == zip_path.name
          assert manifest["artifact"]["sha256"] == hashlib.sha256(zip_path.read_bytes()).hexdigest()
          with zipfile.ZipFile(zip_path) as archive:
              actual = {
                  name: hashlib.sha256(archive.read(name)).hexdigest()
                  for name in archive.namelist()
              }
              archive.extractall(zip_path.parent / "extracted")
          expected = {entry["path"]: entry["sha256"] for entry in manifest["files"]}
          assert actual == expected
          PY

          rsync -a --delete \
            "${release_dir}/extracted/" "${fork_dir}/spec-kit/presets/workflow-preset/"

          cd "${fork_dir}/spec-kit"
          cp "${release_dir}/${MANIFEST_NAME}" "presets/workflow-preset.release.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          import yaml

          version = os.environ["VERSION"]
          release_manifest = json.loads(
              Path("presets/workflow-preset.release.json").read_text(encoding="utf-8")
          )
          catalog_path = Path("presets/catalog.json")
          community_catalog_path = Path("presets/catalog.community.json")
          manifest_path = Path("presets/workflow-preset/preset.yml")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          community_catalog = json.loads(community_catalog_path.read_text(encoding="utf-8"))
          manifest = yaml.safe_load(manifest_path.read_text(encoding="utf-8"))
          provided = manifest["provides"]["templates"]
          command_count = sum(1 for item in provided if item["type"] == "command")
          template_count = sum(1 for item in provided if item["type"] == "template")
          for entry in (
              catalog["presets"]["workflow-preset"],
              community_catalog["presets"]["workflow-preset"],
          ):
              entry["version"] = version
              entry["repository"] = manifest["preset"]["repository"]
              entry["requires"]["speckit_version"] = manifest["requires"]["speckit_version"]
              entry["provides"]["commands"] = command_count
              entry["provides"]["templates"] = template_count
              entry["tags"] = manifest["tags"]
              entry["source_commit"] = release_manifest["source_commit"]
              entry["sha256"] = release_manifest["artifact"]["sha256"]
          community_catalog["presets"]["workflow-preset"]["download_url"] = (
              f"https://github.com/bigsmartben/spec-kit-workflow-preset/"
              f"releases/download/v{version}/spec-kit-workflow-preset-v{version}.zip"
          )
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          community_catalog_path.write_text(
              json.dumps(community_catalog, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          tests_path = Path("tests/test_presets.py")
          tests_text = tests_path.read_text(encoding="utf-8")
          tests_text = re.sub(
              r'assert entry\["version"\] == "[0-9]+\.[0-9]+\.[0-9]+"',
              f'assert entry["version"] == "{version}"',
              tests_text,
          )
          tests_path.write_text(tests_text, encoding="utf-8")
          PY

          python3 -m pip install -e '.[test]'
          python3 -m pytest tests/test_presets.py -k 'workflow_preset'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="workflow-preset-release-v${VERSION}"
          git switch -C "${branch}" "origin/${INPUT_SPEC_KIT_REF}"
          git add presets/catalog.json presets/catalog.community.json \
            presets/workflow-preset presets/workflow-preset.release.json \
            tests/test_presets.py
          if git diff --cached --quiet; then
            echo "No workflow-preset integration changes to commit."
            exit 0
          fi
          git commit -m "Update workflow-preset to v${VERSION}" \
            -m "Assisted-by: GitHub Actions (autonomous)"
          git push --force-with-lease origin "${branch}"

          body_file="$(mktemp)"
          {
            echo "## Summary"
            echo "- Update bundled workflow-preset to v${VERSION}."
            echo "- Update presets/catalog.json and presets/catalog.community.json metadata."
            echo "- Release artifact: ${WORKFLOW_PRESET_DOWNLOAD_URL}"
            echo
            echo "## Test Plan"
            echo "- [x] python3 -m pytest tests/test_presets.py -k 'workflow_preset'"
          } > "${body_file}"
          if gh pr view "${branch}" --repo bigsmartben/spec-kit >/dev/null 2>&1; then
            gh pr edit "${branch}" --repo bigsmartben/spec-kit \
              --title "Update workflow-preset to v${VERSION}" \
              --body-file "${body_file}"
          else
            gh pr create --repo bigsmartben/spec-kit \
              --base "${INPUT_SPEC_KIT_REF}" \
              --head "${branch}" \
              --title "Update workflow-preset to v${VERSION}" \
              --body-file "${body_file}"
          fi
