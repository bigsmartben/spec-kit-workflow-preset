schema_version: "1.0"
workflow:
  id: "speckit-orchestrated-implement"
  name: "Orchestrated Implementation"
  version: "1.0.0"
  author: "bigsmartben"
  description: "Builds task handoff shards, then dispatches speckit.implement once per shard"

requires:
  speckit_version: ">=0.8.10.dev0"

inputs:
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use for shard execution"
  model:
    type: string
    default: ""
    prompt: "Optional model passed to the integration CLI"
  args:
    type: string
    default: ""
    prompt: "Additional implementation arguments"
  max_shards:
    type: number
    default: 8
    prompt: "Maximum number of handoff shards"
  run_id:
    type: string
    default: "manual"
    prompt: "Run id used to namespace generated handoff files"
  dry_run:
    type: boolean
    default: false
    prompt: "Build handoff shards without dispatching agent runs"

steps:
  - id: orchestrate
    type: shell
    run: >-
      uv run .specify/presets/workflow-preset/scripts/run-orchestrated-implement.py
      --project-root .
      --run-id "{{ inputs.run_id }}"
      --max-shards "{{ inputs.max_shards }}"
      --integration "{{ inputs.integration }}"
      --model "{{ inputs.model }}"
      --args="{{ inputs.args }}"
      --dry-run "{{ inputs.dry_run }}"
