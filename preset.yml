schema_version: "1.0"

preset:
  id: "workflow-preset"
  name: "Workflow Preset"
  version: "1.0.0"
  description: "Plan design artifacts and orchestrated implementation workflow"
  author: "bigsmartben"
  repository: "https://github.com/bigsmartben/spec-kit-workflow-preset"
  license: "MIT"

requires:
  speckit_version: ">=0.8.10.dev0"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Add design artifact navigation to the plan template"
      replaces: "plan-template"
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Wrap core planning with optional class, sequence, and test design artifacts"
      replaces: "speckit.plan"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Wrap task generation with optional design artifact awareness"
      replaces: "speckit.tasks"
      strategy: "wrap"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Run orchestrated implementation or execute a single handoff shard"
      replaces: "speckit.implement"
      strategy: "replace"
  files:
    - "scripts/build-task-shards.py"
    - "scripts/run-orchestrated-implement.py"
    - "workflows/speckit-orchestrated-implement/workflow.yml"

  workflows:
    - id: "speckit-orchestrated-implement"
      file: "workflows/speckit-orchestrated-implement/workflow.yml"
      description: "Build handoff shards and dispatch isolated implementation runs"

tags:
  - "planning"
  - "design"
  - "implementation"
  - "orchestration"
  - "workflow"
  - "spec-kit"
